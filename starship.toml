# Starship prompt config
# https://starship.rs/config/

# Timeout for commands (ms)
command_timeout = 1000

# Prompt format
format = """
$terraform\
$directory\
$git_branch\
$git_status\
$ruby\
$nodejs\
$python\
$golang\
$rust\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "blue bold"

[git_branch]
symbol = " "
style = "purple"

[git_status]
style = "red"
format = '([$all_status$ahead_behind]($style) )'

[ruby]
symbol = "💎 "
style = "red"

[nodejs]
symbol = " "
style = "green"

[python]
symbol = "🐍 "
style = "yellow"

[golang]
symbol = "🐹 "
style = "cyan"

[rust]
symbol = "🦀 "
style = "red"

[terraform]
symbol = "💠 "
style = "purple"
format = '[$symbol$workspace]($style) '

[cmd_duration]
min_time = 2000
format = "took [$duration](yellow) "
