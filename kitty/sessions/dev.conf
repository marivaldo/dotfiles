# Layout: vim grande à esquerda, 3 painéis menores à direita
# +------------------+--------+
# |                  |   top  |
# |                  +--------+
# |      VIM         |  mid   |
# |                  +--------+
# |                  | bottom |
# +------------------+--------+

layout splits

# Painel esquerdo (principal)
cd ~
launch fish

# Split vertical - coluna direita (top)
launch --location=vsplit fish

# Split horizontal - mid
launch --location=hsplit fish

# Split horizontal - bottom
launch --location=hsplit fish
